// ===================== مخطط الشمول =====================
function roundRobin(units, listOf, n, used) {
  const pools = units.map((u) => ({ u, list: shuffle(listOf(u)).filter((x) => !used || !used.has(x.toLowerCase())) }));
  const out = []; let guard = 0;
  while (out.length < n && guard++ < 200) {
    let added = false;
    for (const p of shuffle(pools)) {
      if (out.length >= n) break;
      const x = p.list.shift(); if (!x) continue;
      if (used) { if (used.has(x.toLowerCase())) continue; used.add(x.toLowerCase()); }
      out.push({ unit: p.u.u, unitTitle: p.u.title, target: x, words: p.u.vocab.slice(0, 25) });

}
function buildBlueprint(units) {
  const g = roundRobin(units, (u) => u.grammar, 14);
  const doIdx = new Set([1, 5, 9, 12]);
  const grammar = g.map((s, i) => ({ ...s, kind: doIdx.has(i) ? 'do' : 'mcq' }));
  const used = new Set();
  const single = (u) => u.vocab.filter((w) => /^[a-z]{4,}$/i.test(w));
  const spelling = roundRobin(units, single, 10, used).map((s) => ({ ...s, kind: 'spell' }));
  const kinds = [...Array(4).fill('mcq'), ...Array(4).fill('match'), ...Array(6).fill('picture'), ...Array(4).fill('odd')];
  const vw = roundRobin(units, (u) => u.vocab, 18, used);
  const vocab = kinds.map((k, i) => ({ ...(vw[i] || vw[i % Math.max(1, vw.length)]), kind: k }));
  const order = shuffle(units);
  const ru = order[0]; const cu = order[1] || order[0];
  return {
    grammar: [...grammar.filter((x) => x.kind === 'mcq'), ...grammar.filter((x) => x.kind === 'do')], vocab, spelling,
    reading: { kind: 'reading', unit: ru.u, unitTitle: ru.title, target: ru.reading, words: ru.vocab.slice(0, 25) },
    composition: { kind: 'composition', unit: cu.u, unitTitle: cu.title, target: cu.writing, words: cu.vocab.slice(0, 20) },
  };
}

// ===================== التوليد =====================
async function callSection(section, items, ctx) {
  const p = EXAM ? EXAM.meta : prefs();
  const body = { section, grade: C[p.grade].name + ' (' + GRADE_EN[p.grade] + ')', term: p.term, difficulty: p.diff, items, ctx: ctx || {} };
  const { data, error } = await sb.functions.invoke('exam-generate', { body });
  if (error) {
    let code = '';
    try { const j = await error.context.json(); code = j.code || j.detail || ''; } catch {}
    throw new Error(code === 'forbidden' ? 'غير مسموح' : code === 'auth' ? 'انتهت الجلسة — سجّل الدخول من جديد' : 'تعذّر الاتصال');
  }
  if (!data || data.failed) throw new Error('لم يرد الذكاء الاصطناعي، حاول مرة أخرى');
  return data;
}
const norm = (s) => String(s ?? '').replace(/\s+/g, ' ').trim();
function normMCQ(raw, spec, n = 4) {
  let options = (Array.isArray(raw?.options) ? raw.options : []).map(norm).filter(Boolean).slice(0, n);
  const ansText = norm(raw?.answer);
  let ans = options.findIndex((o) => o.toLowerCase() === ansText.toLowerCase());
  const ok = options.length === n && ans >= 0;
  if (ok) { const correct = options[ans]; options = shuffle(options); ans = options.indexOf(correct); }
  while (options.length < n) options.push('');
  return { ...spec, stem: norm(raw?.stem || raw?.q), options, ans: Math.max(0, ans), warn: !ok };
}
function normGrammar(raw, spec) {
  if (spec.kind === 'do') return { ...spec, sentence: norm(raw?.sentence), instruction: norm(raw?.instruction), answer: norm(raw?.answer), warn: !raw?.sentence };
  return normMCQ(raw, spec);
}
function normVocab(raw, spec) {
  if (spec.kind === 'match') return { ...spec, word: norm(raw?.word || spec.target), meaning: norm(raw?.meaning), warn: !raw?.meaning };
  if (spec.kind === 'picture') return { ...spec, word: norm(raw?.word || spec.target), img: '' };
  return normMCQ(raw, spec);
}
function normSpell(raw, spec) {
  const choices = (Array.isArray(raw?.choices) ? raw.choices : []).map((c) => norm(c).slice(0, 2)).filter(Boolean).slice(0, 3);
  const ans = choices.findIndex((c) => c.toLowerCase() === norm(raw?.answer).toLowerCase());
  const ok = choices.length === 3 && ans >= 0 && /_/.test(raw?.sentence || '');
  while (choices.length < 3) choices.push('');
  return { ...spec, word: norm(raw?.word || spec.target), sentence: norm(raw?.sentence), choices, ans: Math.max(0, ans), warn: !ok };
}
function normReading(d, spec) {
  const mcq = (d?.mcq || []).slice(0, 5).map((q) => normMCQ({ ...q, stem: q.q }, {}));
  const tf = (d?.tf || []).slice(0, 4).map((t) => ({ s: norm(t.s), ans: t.answer === true || String(t.answer).toLowerCase() === 'true' }));
  return { ...spec, title: norm(d?.title), passage: String(d?.passage || '').trim(), mcq, tf, warn: mcq.length < 5 || tf.length < 4 };
}
function normComposition(d, spec) {
  if (d?.mode === 'wordbox') return { ...spec, mode: 'wordbox', title: norm(d.title), instructions: norm(d.instructions) || 'Fill in the blanks with a suitable word from the box below', paragraph: norm(d.paragraph), answers: (d.answers || []).map(norm).slice(0, 8), boxOrder: null };
  return { ...spec, mode: 'guided', title: norm(d?.title), instructions: norm(d?.instructions), questions: (d?.questions || []).map(norm).filter(Boolean).slice(0, 6), model: norm(d?.model) };
}

function setProg(states) {
  const names = { composition: 'التعبير', reading: 'القراءة', grammar: 'القواعد', vocab: 'المفردات', spelling: 'الإملاء' };
  $('prog').innerHTML = Object.entries(states).map(([k, s]) => `<span class="${s}">${names[k]} ${s === 'ok' ? '✓' : s === 'err' ? '✗' : '…'}</span>`).join('');
}
const readingWords = (d) => (d === 'easy' ? 100 : d === 'hard' ? 150 : 125);
async function generate() {
  const units = selectedUnits();
  if (!units.length) { toast('اختر وحدة واحدة على الأقل'); return; }
  const p = prefs(); savePrefs();
  const bp = buildBlueprint(units);
  const grammarCtx = units.flatMap((u) => u.grammar).join('; ');
  EXAM = { v: 1, meta: { ...p, units: units.map((u) => u.u) }, grammar: [], vocab: [], spelling: [], reading: null, composition: null, bp };
  const st = { composition: '', reading: '', grammar: '', vocab: '', spelling: '' }; setProg(st);
  $('genBtn').disabled = true; $('genBtn').textContent = 'جارٍ التوليد…';
  const jobs = {
    composition: () => callSection('composition', [bp.composition], { mode: p.cmode }).then((r) => { EXAM.composition = normComposition(r.data, bp.composition); }),
    reading: () => callSection('reading', [bp.reading], { words: readingWords(p.diff), grammar: grammarCtx }).then((r) => { EXAM.reading = normReading(r.data, bp.reading); }),
    grammar: () => callSection('grammar', bp.grammar).then((r) => { EXAM.grammar = bp.grammar.map((s, i) => normGrammar((r.items || [])[i], s)); }),
    vocab: () => callSection('vocab', bp.vocab).then((r) => { EXAM.vocab = bp.vocab.map((s, i) => normVocab((r.items || [])[i], s)); }),
    spelling: () => callSection('spelling', bp.spelling).then((r) => { EXAM.spelling = bp.spelling.map((s, i) => normSpell((r.items || [])[i], s)); }),
  };
  const errors = [];
  await Promise.all(Object.entries(jobs).map(async ([k, fn]) => {
    for (let attempt = 0; attempt < 2; attempt++) {
      try { await fn(); st[k] = 'ok'; setProg(st); return; } catch (e) { if (attempt === 1) { st[k] = 'err'; setProg(st); errors.push(e.message); } }
    }
  }));
  $('genBtn').disabled = false; $('genBtn').textContent = 'توليد الاختبار';
  if (errors.length) toast('بعض الأقسام لم تُولَّد: ' + errors[0] + ' — استخدم زر «↻ القسم».', 6000);
  saveDraft(); renderEditor(); showStep(2);
}

async function regen(section, idx) {
  const p = EXAM.meta; const units = C[p.grade].units.filter((u) => p.units.includes(u.u));
  const host = idx != null ? document.querySelector(`.it[data-sec="${section}"][data-i="${idx}"], .pc[data-i="${idx}"]`) : $('sec-' + section);
  host?.classList.add('busy');
  try {
    const f = section === 'grammar' ? normGrammar : section === 'vocab' ? normVocab : normSpell;
    if (section === 'reading' || section === 'composition') {
      const cur = EXAM[section];
      const spec = cur ? { kind: section, unit: cur.unit, unitTitle: cur.unitTitle, target: cur.target, words: cur.words } : (EXAM.bp || buildBlueprint(units))[section];
      const r = await callSection(section, [spec], section === 'reading' ? { words: readingWords(p.diff), grammar: units.flatMap((u) => u.grammar).join('; ') } : { mode: p.cmode });
      EXAM[section] = section === 'reading' ? normReading(r.data, spec) : normComposition(r.data, spec);
    } else if (idx == null) {
      const src = EXAM[section] && EXAM[section].length ? EXAM[section] : (EXAM.bp || buildBlueprint(units))[section];
      const specs = src.map(({ kind, unit, unitTitle, target, words }) => ({ kind, unit, unitTitle, target, words }));
      const r = await callSection(section, specs);
      const old = EXAM[section] || [];
      EXAM[section] = specs.map((s, i) => { const n = f((r.items || [])[i], s); if (old[i]?.img && s.kind === 'picture') { n.img = old[i].img; n.word = old[i].word; } return n; });
    } else {
      const old = EXAM[section][idx];
      const spec = { kind: old.kind, unit: old.unit, unitTitle: old.unitTitle, target: old.target, words: old.words };
      const r = await callSection(section, [spec]);
      EXAM[section][idx] = f((r.items || [])[0], spec);
    }
    saveDraft(); renderEditor();
  } catch (e) { toast(e.message); host?.classList.remove('busy'); }
}

// ===================== تقرير الشمول =====================
function renderCoverage() {
  const m = EXAM.meta; const units = C[m.grade].units.filter((u) => m.units.includes(u.u));
  const rows = units.map((u) => {
    const g = EXAM.grammar.filter((x) => x.unit === u.u).length;
    const v = EXAM.vocab.filter((x) => x.unit === u.u).length + EXAM.spelling.filter((x) => x.unit === u.u).length;
    const extra = [EXAM.reading?.unit === u.u ? 'قراءة' : '', EXAM.composition?.unit === u.u ? 'تعبير' : ''].filter(Boolean).join('، ');
    return `<tr><td>${u.u}. <span dir="ltr">${esc(u.title)}</span></td><td>${g}</td><td>${v}</td><td>${extra || '—'}</td></tr>`;
  }).join('');
  const covered = new Set(EXAM.grammar.map((x) => x.unit + '|' + x.target));
  let pts = ''; let n = 0; let tot = 0;
  for (const u of units) for (const gpt of u.grammar) { tot++; const ok = covered.has(u.u + '|' + gpt); if (ok) n++; pts += `<li class="${ok ? '' : 'no'}">${ok ? '✓' : '○'} U${u.u}: ${esc(gpt)}</li>`; }
  const warns = document.querySelectorAll('#edBody .warn').length;
  const pics = EXAM.vocab.filter((x) => x.kind === 'picture'); const miss = pics.filter((x) => !x.img).length;
  $('coverage').innerHTML = `<h2>تقرير الشمول</h2>
    <table class="cov"><tr><th>الوحدة</th><th>قواعد</th><th>مفردات</th><th>نص</th></tr>${rows}</table>
    <div class="muted" style="margin-top:8px">نقاط القواعد المغطاة: <b>${n}</b> من ${tot}.</div>
    <ul class="pts">${pts}</ul>
    ${warns ? `<div class="muted" style="color:var(--warn);margin-top:8px">⚠ ${warns} فقرة تحتاج مراجعة (بخلفية برتقالية).</div>` : ''}
    ${miss ? `<div class="muted" style="color:var(--warn);margin-top:4px">🖼 ${miss} صورة لم تُرفع بعد.</div>` : ''}`;
}

// ===================== ربط التحرير بالنموذج =====================
function setPath(path, val) {
  const parts = path.split('.'); let o = EXAM;
  for (let i = 0; i < parts.length - 1; i++) { o = o[isNaN(parts[i]) ? parts[i] : +parts[i]]; if (o == null) return; }
  const last = parts[parts.length - 1]; o[isNaN(last) ? last : +last] = val;
}
function getPath(path) { return path.split('.').reduce((o, k) => (o == null ? o : o[isNaN(k) ? k : +k]), EXAM); }
document.addEventListener('input', (e) => {
  const el = e.target; if (!EXAM || !el.dataset || !el.dataset.p) return;
  setPath(el.dataset.p, el.tagName === 'TEXTAREA' ? el.value : el.value.replace(/\s+/g, ' '));
  // إذا عُدّلت كلمة صورة، يتحدث اسمها في المربع فوراً
  const pc = el.closest('.pc'); if (pc) { const w = pc.querySelector('.drop .w'); if (w) w.textContent = el.value; }
  clearTimeout(document._sv); document._sv = setTimeout(saveDraft, 500);
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset && el.dataset.ans && EXAM) {
    const it = getPath(el.dataset.ans); it.ans = +el.value; it.warn = false;
    el.closest('.opts').querySelectorAll('.opt').forEach((o, j) => o.classList.toggle('ok', j === it.ans));
    el.closest('.it')?.classList.remove('warn');
    saveDraft(); renderCoverage();
  }
});
document.addEventListener('click', (e) => {
  const rg = e.target.closest('[data-regen]');
  if (rg) { regen(rg.dataset.regen, rg.dataset.i != null ? +rg.dataset.i : null); return; }
  const tf = e.target.closest('[data-tf] button');

  const dp = e.target.closest('[data-delpic]');
  if (dp) { EXAM.vocab[+dp.dataset.delpic].img = ''; saveDraft(); renderEditor(); return; }

document.addEventListener('dragover', (e) => { const d = e.target.closest?.('.drop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', (e) => { const d = e.target.closest?.('.drop'); if (d) d.classList.remove('over'); });
document.addEventListener('drop', (e) => {
  const d = e.target.closest?.('.drop'); if (!d) return; e.preventDefault(); d.classList.remove('over');
  const f = e.dataTransfer?.files?.[0]; if (f) setPic(+d.dataset.pic, f);

$('picFile').addEventListener('change', (e) => { const f = e.target.files?.[0]; if (f) setPic(+e.target.dataset.i, f); });
async function setPic(i, f) {
  if (!/^image\//.test(f.type)) { toast('اختر ملف صورة'); return; }
  try { EXAM.vocab[i].img = await shrinkImage(f, 500); saveDraft(); renderEditor(); }
  catch { toast('تعذّر قراءة الصورة'); }
}
function shrinkImage(file, max) {
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url); res(cv.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}

// ===================== الورقة (للمعاينة والتصدير) =====================
function ensureOrders() {
  const c = EXAM.composition;
  if (c && c.mode === 'wordbox' && (!c.boxOrder || c.boxOrder.length !== c.answers.length)) c.boxOrder = shuffle(c.answers.map((_, i) => i));
  const mt = EXAM.vocab.filter((x) => x.kind === 'match');
  if (!EXAM.matchOrder || EXAM.matchOrder.length !== mt.length) EXAM.matchOrder = shuffle(mt.map((_, k) => k));
  const pics = EXAM.vocab.filter((x) => x.kind === 'picture');
  if (!EXAM.picBox || EXAM.picBox.length !== pics.length) EXAM.picBox = shuffle(pics.map((_, k) => k));
}
function paperHTML(withKey) {
  ensureOrders();

  const termTxt = m.term === '2' ? 'Second' : 'First';
  let h = `<div class="ph">
    <div>Kingdom of Saudi Arabia<br>Ministry of Education<br>${esc(m.school || 'Intermediate School')}</div>

    <div class="r">${esc(book.name)} – English Language<br>${GRADE_EN[m.grade]}<br>${termTxt} Term Final Exam ${esc(m.year || '')}<br>Time: ${esc(m.time || '')}</div>
  </div>
  <div class="sname">Student's name: …………………………………………… &nbsp; Class: ……… &nbsp; Seat No.: ………</div>`;
  const qh = (n, name, mark) => `<div class="qhead"><b>Q${n} / ${name}</b><span class="qmark">${mark}</span></div>`;

  const c = EXAM.composition;
  h += `<div class="q">${qh(1, 'Composition', 8)}`;
  if (c) {
    if (c.mode === 'wordbox') h += `<div class="qtitle">${esc(c.title)}</div><div class="s-sub">${esc(c.instructions)}</div><div class="box">${c.boxOrder.map((i) => esc(c.answers[i])).join(' &nbsp;–&nbsp; ')}</div><div style="line-height:2">${esc(c.paragraph).replace(/_{2,}/g, '__________')}</div>`;
    else h += `<div class="qtitle">${esc(c.title)}</div><div class="s-sub">${esc(c.instructions || 'Write a paragraph answering the following questions:')}</div><ol style="margin:2px 0 6px 22px;padding:0">${c.questions.map((q) => `<li>${esc(q)}</li>`).join('')}</ol>${'<div class="dots"></div>'.repeat(8)}`;
  }
  h += '</div>';

  const r = EXAM.reading;
  h += `<div class="q">${qh(2, 'Reading Comprehension', 9)}`;
  if (r) {
    h += `<div class="qtitle">${esc(r.title)}</div><div class="passage">${r.passage.split(/\n+/).filter(Boolean).map((p) => `<p>${esc(p)}</p>`).join('')}</div><div class="s-sub">A- Choose the correct answer:</div>`;
    r.mcq.forEach((q, i) => { h += `<div class="pi">${i + 1}. ${esc(q.stem)}<div class="popts">${q.options.map((o, j) => `${L[j]}) ${esc(o)}`).join(' &nbsp;&nbsp; ')}</div></div>`; });
    h += '<div class="s-sub">B- Write (T) for true or (F) for false:</div>';
    r.tf.forEach((t, i) => { h += `<div class="pi">${i + 1}. ${esc(t.s)} &nbsp; (&nbsp;&nbsp;&nbsp;&nbsp;)</div>`; });
  }
  h += '</div>';

  h += `<div class="q">${qh(3, 'Grammar', 9)}`;
  if (EXAM.grammar.length) {
    h += '<div class="s-sub">A- Choose the correct answer:</div>';
    EXAM.grammar.filter((x) => x.kind === 'mcq').forEach((it, n) => { h += `<div class="pi">${n + 1}. ${esc(it.stem)} (${it.options.map(esc).join(' – ')})</div>`; });
    h += '<div class="s-sub">B- Do as shown between brackets:</div>';
    EXAM.grammar.filter((x) => x.kind === 'do').forEach((it, n) => { h += `<div class="pi">${n + 1}. ${esc(it.sentence)} &nbsp; (${esc(it.instruction)})<div class="dots"></div></div>`; });
  }
  h += '</div>';

    mt.forEach((it, n) => { h += `<div class="pi">${n + 1}. ${esc(it.word)}</div><div class="pi">(&nbsp;&nbsp;&nbsp;) ${esc(mt[EXAM.matchOrder[n]].meaning)}</div>`; });
    const pics = V.filter((x) => x.kind === 'picture');
    h += `</div><div class="s-sub">C- Write the correct word under each picture:</div><div class="box">${EXAM.picBox.map((k) => esc(pics[k].word)).join(' &nbsp;–&nbsp; ')}</div><div class="ppics">`;
    pics.forEach((it) => { h += `<div class="ppic"><div class="frame">${it.img ? `<img src="${it.img}" alt="">` : ''}</div><div class="dots"></div></div>`; });
    h += '</div><div class="s-sub">D- Circle the odd word:</div>';

  h += '</div>';

  h += `</div><div class="foot">Best wishes${m.teacher ? '<br>' + esc(m.teacher) : ''}</div>`;
  if (withKey) h += `<div class="pbreak"></div>${keyHTML()}`;
  return h;
}
function keyLines() {
  const out = [];
  const c = EXAM.composition;
  if (c) {
    out.push(['h', 'Q1 Composition (8)']);
    if (c.mode === 'wordbox') out.push(['t', c.answers.map((a, i) => `${i + 1}. ${a}`).join('   ') + '   (1 mark each)']);
    else { out.push(['t', 'Marking (Ministry): vocabulary & language accuracy (3) · punctuation (1) · coherence & sequence of ideas (2) · relevance to the topic (2).']); if (c.model) out.push(['t', 'Model answer: ' + c.model]); }
  }
  const r = EXAM.reading;
  if (r) {
    out.push(['h', 'Q2 Reading Comprehension (9)']);
    out.push(['t', 'A: ' + r.mcq.map((q, i) => `${i + 1}) ${L[q.ans]} – ${q.options[q.ans]}`).join('   ')]);
    out.push(['t', 'B: ' + r.tf.map((t, i) => `${i + 1}) ${t.ans ? 'T' : 'F'}`).join('   ')]);
  }
  if (EXAM.grammar.length) {
    out.push(['h', 'Q3 Grammar (A: ½ each · B: 1 each)']);
    out.push(['t', 'A: ' + EXAM.grammar.filter((x) => x.kind === 'mcq').map((it, n) => `${n + 1}) ${it.options[it.ans]}`).join('   ')]);
    EXAM.grammar.filter((x) => x.kind === 'do').forEach((it, n) => out.push(['t', `B${n + 1}) ${it.answer}`]));
  }
  if (EXAM.vocab.length) {
    const V = EXAM.vocab;
    out.push(['h', 'Q4 Vocabulary (½ each)']);
    out.push(['t', 'A: ' + V.filter((x) => x.kind === 'mcq').map((it, n) => `${n + 1}) ${it.options[it.ans]}`).join('   ')]);
    const mt = V.filter((x) => x.kind === 'match');
    out.push(['t', 'B: ' + mt.map((it, n) => `${n + 1}) ${it.word} = ${it.meaning}`).join('   ')]);
    out.push(['t', 'C: ' + V.filter((x) => x.kind === 'picture').map((it, n) => `${n + 1}) ${it.word}`).join('   ')]);
    out.push(['t', 'D: ' + V.filter((x) => x.kind === 'odd').map((it, n) => `${n + 1}) ${it.options[it.ans]}`).join('   ')]);
  }
  if (EXAM.spelling.length) {
    out.push(['h', 'Q5 Orthography (½ each)']);
    out.push(['t', EXAM.spelling.map((it, i) => `${i + 1}) ${it.choices[it.ans]} (${it.word})`).join('   ')]);
  }
  return out;
}
function keyHTML() { return `<div class="key"><h3>Answer Key</h3>${keyLines().map(([t, s]) => t === 'h' ? `<div class="s-sub">${esc(s)}</div>` : `<div class="k">${esc(s)}</div>`).join('')}</div>`; }

function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
function fileBase() { const m = EXAM.meta; return `Exam_${C[m.grade].name.replace(/\s+/g, '')}_T${m.term}`; }

async function exportDOCX() {
  if (!EXAM) return;
  busyBtns(true);
  try {
    if (!window.docx) await loadScript('https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js');
    ensureOrders();
    const D = window.docx; const m = EXAM.meta; const book = C[m.grade];
    const F = 'Arial';
    const T = (text, o = {}) => new D.TextRun({ text: String(text ?? ''), font: F, size: o.size || 24, bold: o.bold, italics: o.italics });
    const P = (runs, o = {}) => new D.Paragraph({ children: Array.isArray(runs) ? runs : [T(runs, o)], alignment: o.align, spacing: { after: o.after ?? 60, before: o.before ?? 0 }, indent: o.indent ? { left: o.indent } : undefined, border: o.border });
    const dots = () => P('……………………………………………………………………………………………………', { after: 100 });
    const cell = (text, o = {}) => new D.TableCell({ children: [P(text, { align: D.AlignmentType.CENTER, size: o.size || 20, bold: o.bold, after: 0 })], width: o.w ? { size: o.w, type: D.WidthType.DXA } : undefined });
    const nb = { style: D.BorderStyle.NONE, size: 0, color: 'FFFFFF' };
    const noB = { top: nb, bottom: nb, left: nb, right: nb, insideHorizontal: nb, insideVertical: nb };
    const qh = (n, name, mark) => P([T(`Q${n} / ${name}`, { bold: true, size: 26 }), new D.TextRun({ text: `\t( ${mark} )`, font: F, size: 26, bold: true })], { before: 200, after: 80, border: { bottom: { style: D.BorderStyle.SINGLE, size: 6, color: '000000' } } });
    const sub = (t) => P(t, { bold: true, before: 80 });
    const boxed = (children) => new D.Table({ width: { size: 100, type: D.WidthType.PERCENTAGE }, rows: [new D.TableRow({ children: [new D.TableCell({ children })] })] });
    const kids = [];
    const termTxt = m.term === '2' ? 'Second' : 'First';
    const R = D.AlignmentType.RIGHT;
    kids.push(new D.Table({
      width: { size: 100, type: D.WidthType.PERCENTAGE }, borders: noB,
      rows: [new D.TableRow({ children: [
        new D.TableCell({ children: [P('Kingdom of Saudi Arabia', { size: 20, after: 0 }), P('Ministry of Education', { size: 20, after: 0 }), P(m.school || 'Intermediate School', { size: 20, after: 0 })] }),
        new D.TableCell({ children: [P(`${book.name} – English Language`, { size: 20, after: 0, align: R }), P(GRADE_EN[m.grade], { size: 20, after: 0, align: R }), P(`${termTxt} Term Final Exam ${m.year || ''}`, { size: 20, after: 0, align: R }), P(`Time: ${m.time || ''}`, { size: 20, after: 0, align: R })] }),
      ] })],
    }));
    kids.push(P('', { after: 60 }));
    kids.push(new D.Table({ alignment: D.AlignmentType.CENTER, rows: [
      new D.TableRow({ children: ['Question', 'Q1', 'Q2', 'Q3', 'Q4', 'Q5', 'Total'].map((x) => cell(x, { w: 1000 })) }),
      new D.TableRow({ children: ['Mark', '8', '9', '9', '9', '5', '40'].map((x) => cell(x, { w: 1000, bold: x === '40' })) }),
      new D.TableRow({ children: ["Student's mark", '', '', '', '', '', ''].map((x) => cell(x, { w: 1000 })) }),
    ] }));
    kids.push(P("Student's name: ……………………………………………  Class: …………  Seat No.: …………", { before: 120, after: 60, border: { bottom: { style: D.BorderStyle.SINGLE, size: 8, color: '000000' } } }));

    const c = EXAM.composition;
    kids.push(qh(1, 'Composition', 8));
    if (c) {
      kids.push(P(c.title, { bold: true, align: D.AlignmentType.CENTER }));
      if (c.mode === 'wordbox') {
        kids.push(sub(c.instructions));
        kids.push(boxed([P(c.boxOrder.map((i) => c.answers[i]).join('  –  '), { align: D.AlignmentType.CENTER, after: 40 })]));

      } else {

    }

      kids.push(sub('A- Choose the correct answer:'));
      r.mcq.forEach((q, i) => { kids.push(P(`${i + 1}. ${q.stem}`)); kids.push(P(q.options.map((o, j) => `${L[j]}) ${o}`).join('      '), { indent: 300 })); });
      kids.push(sub('B- Write (T) for true or (F) for false:'));
      r.tf.forEach((t, i) => kids.push(P(`${i + 1}. ${t.s}   (      )`)));
    }

    if (EXAM.grammar.length) {
      kids.push(sub('A- Choose the correct answer:'));
      EXAM.grammar.filter((x) => x.kind === 'mcq').forEach((it, n) => kids.push(P(`${n + 1}. ${it.stem}  (${it.options.join(' – ')})`)));
      kids.push(sub('B- Do as shown between brackets:'));
      EXAM.grammar.filter((x) => x.kind === 'do').forEach((it, n) => { kids.push(P(`${n + 1}. ${it.sentence}     (${it.instruction})`)); kids.push(dots()); });
    }
    kids.push(qh(4, 'Vocabulary', 9));
    if (EXAM.vocab.length) {
      const V = EXAM.vocab;
      kids.push(sub('A- Choose the correct answer:'));
      V.filter((x) => x.kind === 'mcq').forEach((it, n) => kids.push(P(`${n + 1}. ${it.stem}   (${it.options.join(' – ')})`)));
      kids.push(sub('B- Match the word with its meaning:'));
      const mt = V.filter((x) => x.kind === 'match');
      kids.push(new D.Table({ width: { size: 100, type: D.WidthType.PERCENTAGE }, borders: noB, rows: mt.map((it, n) => new D.TableRow({ children: [new D.TableCell({ children: [P(`${n + 1}. ${it.word}`, { after: 20 })] }), new D.TableCell({ children: [P(`(     ) ${mt[EXAM.matchOrder[n]].meaning}`, { after: 20 })] })] })) }));
      const pics = V.filter((x) => x.kind === 'picture');
      kids.push(sub('C- Write the correct word under each picture:'));
      kids.push(boxed([P(EXAM.picBox.map((k) => pics[k].word).join('  –  '), { align: D.AlignmentType.CENTER, after: 40 })]));
      const picCell = (it) => {

          const bin = atob(it.img.split(',')[1]); const u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
          ch.push(new D.Paragraph({ alignment: D.AlignmentType.CENTER, children: [new D.ImageRun({ data: u8, transformation: { width: 130, height: 100 } })] }));

    }
    kids.push(qh(5, 'Orthography', 5));

    }

  } catch (e) { console.error(e); toast('تعذّر إنشاء ملف Word.'); }
  finally { busyBtns(false); }
}
